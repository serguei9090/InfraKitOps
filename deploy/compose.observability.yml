# Optional metrics stack. Layer it on the main compose file:
#
#   cd deploy
#   echo -n "$TOKEN" > infrakit_token          # a bearer/session token for /metrics
#   docker compose -f compose.yml -f compose.observability.yml up -d
#
# Grafana → http://localhost:3000  (admin / admin on first login).
# The "InfraKit Studio — overview" dashboard is auto-provisioned.

services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrakit_token:/etc/prometheus/infrakit_token:ro
      - prom_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prom_data:
  grafana_data:
