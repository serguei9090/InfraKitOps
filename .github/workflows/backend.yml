name: backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'vendor-tools/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'vendor-tools/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: vet + test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - name: coded errors only (ERROR_HANDLING_PLAN E3c)
        shell: bash
        run: |
          if grep -rnE 'map\[string\]string\{"error": [^,}]*\}' internal/api; then
            echo "::error::bare {\"error\"} HTTP response in internal/api — use apierr.Write(w, apierr.X(...)). SSE error events may carry a \"code\" key."
            exit 1
          fi
      - run: go test ./... -count=1

  vendor-tools:
    name: verify vendored binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch + verify SHA-256
        working-directory: vendor-tools
        run: ./fetch-tools.sh

  build:
    name: cross-compile sidecar
    runs-on: ubuntu-latest
    needs: [test, vendor-tools]
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            triple: x86_64-pc-windows-msvc
            ext: .exe
          - goos: linux
            goarch: amd64
            triple: x86_64-unknown-linux-gnu
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: build backend + helper
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          LDFLAGS="-s -w -X github.com/infrakit/backend/internal/api.Version=${VERSION}"
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "dist/infrakit-backend-${{ matrix.triple }}${{ matrix.ext }}" ./cmd/infrakit-backend
          go build -trimpath -ldflags "-s -w" \
            -o "dist/infrakit-helper-${{ matrix.triple }}${{ matrix.ext }}" ./cmd/infrakit-helper
      - name: bundle vendored tools
        run: |
          (cd ../vendor-tools && ./fetch-tools.sh)
          if [ -f "../vendor-tools/bin/iperf3-${{ matrix.goos }}-${{ matrix.goarch }}" ]; then
            cp "../vendor-tools/bin/iperf3-${{ matrix.goos }}-${{ matrix.goarch }}" \
               "dist/iperf3${{ matrix.ext }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: infrakit-backend-${{ matrix.triple }}
          path: backend/dist/*
          if-no-files-found: error
