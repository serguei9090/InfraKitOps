name: backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: vet + test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test ./... -count=1

  build:
    name: cross-compile sidecar
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            triple: x86_64-pc-windows-msvc
            ext: .exe
          - goos: linux
            goarch: amd64
            triple: x86_64-unknown-linux-gnu
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          go build -trimpath \
            -ldflags "-s -w -X github.com/infrakit/backend/internal/api.Version=${VERSION}" \
            -o "infrakit-backend-${{ matrix.triple }}${{ matrix.ext }}" \
            ./cmd/infrakit-backend
      - uses: actions/upload-artifact@v4
        with:
          name: infrakit-backend-${{ matrix.triple }}
          path: backend/infrakit-backend-${{ matrix.triple }}${{ matrix.ext }}
          if-no-files-found: error
