name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: build + test + lint + bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: bundle budget (CS4)
        run: bun run check:bundle
      - name: version files in sync
        run: bun run set-version
