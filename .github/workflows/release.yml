name: release

# Cut a release by pushing a tag:  git tag v0.2.0 && git push origin v0.2.0
# or run it manually from the Actions tab with a version like 0.2.0.
#
# Attaches to a DRAFT GitHub Release:
#   Desktop installers
#     Windows   InfraKit Studio_<v>_x64_en-US.msi   +  _x64-setup.exe (NSIS)
#     Linux     infrakit-studio_<v>_amd64.deb        +  .AppImage
#   Self-hosted web bundle  (backend binary + built UI + launcher, one folder)
#     infrakit-studio-web-<v>-linux-amd64.zip
#     infrakit-studio-web-<v>-windows-amd64.zip
#
# Review the draft, then publish it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'semver, no leading v (e.g. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release_id: ${{ steps.rel.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"    >> "$GITHUB_OUTPUT"
      - name: Assemble the release body (CHANGELOG section + install guide)
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          # this version's section from CHANGELOG.md, up to the next "## ["
          awk -v v="$V" '
            index($0, "## [" v "]") == 1 { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > body.md
          printf '\n---\n\n' >> body.md
          cat .github/release-body.md >> body.md
          echo "::group::release body"; cat body.md; echo "::endgroup::"
      - id: rel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: InfraKit Studio ${{ steps.v.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body_path: body.md

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux WebKit / bundler deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev   # tray-icon (Monitors minimise-to-tray)

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: install frontend deps
        working-directory: app
        run: bun install --frozen-lockfile

      - name: stamp version into the 3 files
        working-directory: app
        run: bun run set-version "${{ needs.create-release.outputs.version }}"

      - name: build Go sidecar (host triple)
        working-directory: app
        run: bun run build:sidecar

      # Provide signing secrets in the repo to enable code signing:
      #   Windows: WINDOWS_CERT (base64 .pfx) + WINDOWS_CERT_PASSWORD
      #   (wire them into tauri.conf.json's bundle.windows.certificateThumbprint
      #    or the signCommand — left unset here, builds are unsigned.)
      - name: tauri build + upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'   # AppImage runtime, no FUSE on the runner
          NO_STRIP: 'true'
        with:
          projectPath: app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Linux: .deb only for now. rpm/appimage are built by targets:"all"
          # but not attached — revisit once they're verified on a clean box.
          args: ${{ runner.os == 'Linux' && '--bundles deb' || '' }}

  # Build the frontend once; every web-bundle variant reuses it.
  web-frontend:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: build
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run set-version "${{ needs.create-release.outputs.version }}"
          bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/dist
          retention-days: 1

  web-bundle:
    needs: [create-release, web-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: '',     label: linux-amd64 }
          - { goos: windows, goarch: amd64, ext: '.exe',  label: windows-amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: bundle/web

      - name: build backend (${{ matrix.label }})
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          V="${{ needs.create-release.outputs.version }}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/infrakit/backend/internal/api.Version=$V" \
            -o "../bundle/infrakit-backend${{ matrix.ext }}" ./cmd/infrakit-backend

      - name: assemble + zip
        run: |
          cp packaging/web-bundle/README.md bundle/
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp packaging/web-bundle/run.bat bundle/
          else
            cp packaging/web-bundle/run.sh bundle/
            chmod +x bundle/run.sh bundle/infrakit-backend
          fi
          Z="infrakit-studio-web-${{ needs.create-release.outputs.version }}-${{ matrix.label }}.zip"
          ( cd bundle && zip -r "../$Z" . )

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: true
          files: infrakit-studio-web-${{ needs.create-release.outputs.version }}-${{ matrix.label }}.zip
