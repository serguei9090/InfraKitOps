name: image

# Builds the hosted-deployment container, smoke-tests it, and — on main or a
# version tag — publishes it to GitHub Container Registry.
#
#   ghcr.io/<owner>/infrakitops:latest      (main)
#   ghcr.io/<owner>/infrakitops:0.5.0       (tag v0.5.0)
#   ghcr.io/<owner>/infrakitops:sha-<short>
#
# Pull requests build + smoke-test only; nothing is pushed.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - 'app/**'
      - 'backend/**'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - 'app/**'
      - 'backend/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/infrakitops

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Registry login (skipped on PRs)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=v(.*),group=1
            type=sha,prefix=sha-

      - name: Build (+ push when not a PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          # PR: keep it local for the smoke test. Push events: push to GHCR.
          # (the two are mutually exclusive here — buildx pushes every tag, so
          #  the bare local tag can't ride along on a push.)
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ github.event_name == 'pull_request' && 'infrakit-studio:ci' || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version || format('ci-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — the image serves the API
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMG=infrakit-studio:ci
          else
            IMG="${{ env.IMAGE }}:sha-$(echo ${{ github.sha }} | cut -c1-7)"
            docker pull "$IMG"
          fi
          echo "testing $IMG"
          docker run -d --name ik \
            -e INFRAKIT_AUTH=on \
            -e INFRAKIT_VAULT_PASSPHRASE_FILE=/tmp/vp \
            -p 8080:8080 \
            --entrypoint sh \
            "$IMG" \
            -c 'echo ci-passphrase-123456 > /tmp/vp && exec infrakit-backend'
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/v1/health | grep -q '"authMode":"on"'; then
              echo "health OK"; ok=1; break
            fi
            sleep 1
          done
          docker logs ik
          docker rm -f ik
          [ "${ok:-}" = 1 ] || { echo "health check never passed"; exit 1; }
